<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WalletCopilot | Smart Account Dashboard</title>
    <!-- Tailwind CSS CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              obsidian: {
                950: 'var(--bg-dark)',
                900: 'var(--bg-card)',
                850: 'var(--bg-card-hover)',
                800: '#161f2e',
              },
              mint: {
                DEFAULT: 'var(--primary-accent)',
                400: '#2bf8ab',
                500: 'var(--primary-accent)',
                600: '#00cc7d',
              }
            },
            boxShadow: {
              'mint-sm': '0 0 12px -2px rgba(0, 245, 155, 0.3)',
              'mint-glow': '0 0 25px -5px rgba(0, 245, 155, 0.35)',
              'card-glass': '0 8px 32px 0 rgba(0, 0, 0, 0.45)'
            }
          }
        }
      }
    </script>
  </head>
  <body class="selection:bg-[#00f59b] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
