services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aa_wallet
      POSTGRES_PASSWORD: aa_wallet
      POSTGRES_DB: aa_wallet
    ports:
      - "5432:5432"
    volumes:
      - aa_wallet_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  aa_wallet_postgres:
